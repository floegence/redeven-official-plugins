<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <main class="weather-app">
      <section class="empty-state">
        <div class="weather-card-controls">
          <button class="location-trigger" type="button" aria-label="Choose location">
            <strong class="location-trigger-name">Choose location</strong>
            <span class="location-trigger-arrow" aria-hidden="true">⌄</span>
          </button>
        </div>
        <span class="loading-mark"></span>
        <h2>Loading your weather…</h2>
      </section>
    </main>
    <script type="text/redevplugin-worker" src="assets/app.js"></script>
  </body>
</html>
