<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Containers</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="container-app">
      <header class="topbar">
        <div class="title-block">
          <p class="eyebrow">Redeven Official</p>
          <h1>Containers</h1>
        </div>
        <div class="toolbar" aria-label="Container controls">
          <label class="engine-select">
            <span>Engine</span>
            <select id="engine">
              <option value="docker">Docker</option>
              <option value="podman">Podman</option>
            </select>
          </label>
          <label class="search-box">
            <span class="sr-only">Search containers</span>
            <input id="search" type="search" placeholder="Search name, image, state">
          </label>
          <label class="toggle">
            <input id="runningOnly" type="checkbox">
            <span>Running</span>
          </label>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <section id="status" class="status" aria-live="polite">Connecting to Redeven container resources...</section>

      <section class="pull-panel" aria-label="Pull image">
        <div>
          <h2>Pull Image</h2>
          <p>Pull into the selected Docker or Podman engine.</p>
        </div>
        <form id="pullForm" class="pull-form">
          <input id="imageRef" type="text" placeholder="ghcr.io/example/service:latest" autocomplete="off">
          <button type="submit">Pull</button>
        </form>
      </section>

      <section class="workspace">
        <section class="list-pane" aria-label="Container list">
          <div class="summary">
            <span id="engineSummary">Engine unknown</span>
            <span id="countSummary">0 containers</span>
          </div>
          <div id="containers" class="container-list"></div>
        </section>

        <aside class="details-pane" aria-label="Container details">
          <div id="details" class="details-empty">Select a container to inspect it.</div>
        </aside>
      </section>
    </main>

    <template id="containerRowTemplate">
      <button class="container-row" type="button">
        <span class="row-main">
          <span class="row-title"></span>
          <span class="row-subtitle"></span>
        </span>
        <span class="state-pill"></span>
      </button>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
