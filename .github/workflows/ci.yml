name: Source CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-plugins-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/containers/package-lock.json
      - run: npm ci
      - run: npm --prefix plugins/containers ci
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: npm --prefix plugins/containers audit --audit-level=moderate
