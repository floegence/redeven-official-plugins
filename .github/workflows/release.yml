name: Release Official Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: official-plugins-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/containers/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact released main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r '.plugin.version' plugins/containers/manifest.json)" = "$version"
          test "$(jq -r '.release_train_tag' plugins/containers/release.json)" = "$GITHUB_REF_NAME"
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$tag_commit" = "$GITHUB_SHA"
          test "$remote_main" = "$GITHUB_SHA"
          ci_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | .conclusion" | head -n 1)
          test "$ci_conclusion" = success
      - run: npm ci
      - run: npm --prefix plugins/containers ci
      - run: npm run verify
      - name: Build and verify signed release set
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm run release:prepare -- containers
          npm run release:apply -- containers "releases/containers/$version/responses"
          npm run release:finalize -- containers
          npm run release:verify -- containers
          npm run release:stage-capability -- containers
          output="dist/release/containers/$version/output"
          test "$(find "$output" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 51
          test -f "$output/containers-$version.redevplugin"
          test -f "$output/containers-$version.release-ref.json"
          test -f "$output/containers-$version.capability-bundle.json"
          test -f "$output/containers-$version.host-capability.pin.json"
          test -f "$output/containers-$version.host-capability.public.json"
          test -f "$output/root.public.json"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          output="dist/release/containers/$version/output"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$output"/* \
            --verify-tag \
            --title "Redeven Official Plugins $GITHUB_REF_NAME" \
            --notes "Containers $version with its signed ReDevPlugin release reference and public trust evidence."
          readback=$(mktemp -d)
          trap 'rm -rf "$readback"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$readback"
          diff -qr "$output" "$readback"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
