name: Release Official Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: official-plugins-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/*/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Verify exact released main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${GITHUB_REF_NAME#v}"
          plugin=$(node scripts/resolve_release_plugin.mjs "$GITHUB_REF_NAME")
          test "$(jq -r '.plugin.version' "plugins/$plugin/manifest.json")" = "$version"
          test "$(jq -r '.release_train_tag' "plugins/$plugin/release.json")" = "$GITHUB_REF_NAME"
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$tag_commit" = "$GITHUB_SHA"
          test "$remote_main" = "$GITHUB_SHA"
          ci_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | .conclusion" | head -n 1)
          test "$ci_conclusion" = success
      - run: npm ci
      - run: npm run plugins:ci
      - run: npm run verify
      - name: Build, verify, and publish signed release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_official_plugin_release.sh "$GITHUB_REF_NAME"
