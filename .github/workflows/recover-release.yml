name: Recover Official Plugin Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable official plugin release tag to recover
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: official-plugins-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            release-source/package-lock.json
            release-source/plugins/containers/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify exact immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          test "$(jq -r '.plugin.version' plugins/containers/manifest.json)" = "$version"
          test "$(jq -r '.release_train_tag' plugins/containers/release.json)" = "$RELEASE_TAG"
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          git merge-base --is-ancestor "$tag_commit" "$remote_main"
          ci_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$tag_commit\" and .head_branch == \"main\") | .conclusion" | head -n 1)
          test "$ci_conclusion" = success
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
      - run: npm ci
        working-directory: release-source
      - run: npm --prefix plugins/containers ci
        working-directory: release-source
      - run: npm run verify
        working-directory: release-source
      - name: Build, verify, and publish signed release set
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-source
        run: ../scripts/publish_official_plugin_release.sh "$RELEASE_TAG"
